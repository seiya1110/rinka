<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコード連動ルーレット</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .roulette-container {
            position: relative;
            margin: 20px auto;
            width: 320px;
            height: 320px;
        }
        canvas {
            border-radius: 50%;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
        }
        /* 上部の矢印（針） */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff3b30;
            z-index: 10;
        }
        #stopButton {
            background-color: #ff3b30;
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 25px;
        }
        #stopButton:active {
            transform: scale(0.95);
        }
        #stopButton:disabled {
            background-color: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }
        #result {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-top: 25px;
            height: 40px;
        }
        .info {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>QRコード連動ルーレット</h1>
    <div id="debug-id" class="info"></div>

    <div class="roulette-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="320" height="320"></canvas>
    </div>

    <button id="stopButton" disabled>STOP</button>
    <div id="result"></div>

    <script>
        // 景品の設定（10マス）
        const prizes = ["当たり🎯", "はずれ❌", "当たり🎯", "はずれ❌", "当たり🎯", "はずれ❌", "当たり🎯", "はずれ❌", "当たり🎯", "はずれ❌"];
        const colors = ["#ff7675", "#dfe6e9", "#ff7675", "#dfe6e9", "#ff7675", "#dfe6e9", "#ff7675", "#dfe6e9", "#ff7675", "#dfe6e9"];

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const stopButton = document.getElementById("stopButton");
        const resultDiv = document.getElementById("result");

        let currentAngle = 0; 
        let speed = 0;        
        let isSpinning = false;
        let isStopping = false;
        let targetIndex = 0;  
        
        // 物理減速用の変数
        let stopStartTime = 0;
        let startAngle = 0;
        let targetFinalAngle = 0;
        const duration = 4500; // 減速にかける時間（4.5秒）

        // URLから「?id=xxx」を取得
        function getQrId() {
            let urlParams = new URLSearchParams(window.location.search);
            let id = urlParams.get('id');
            if (!id) {
                const match = window.location.href.match(/[?&]id=([^&#]*)/);
                id = match ? match : null;
            }
            return id;
        }

        const qrId = getQrId() || "default";
        document.getElementById("debug-id").innerText = `読み込んだID: ${qrId}`;

        // ハッシュ関数（結果固定用）
        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return hash;
        }

        const hash = hashCode(qrId);
        targetIndex = Math.abs(hash) % prizes.length;

        // 盤面描画
        function drawWheel() {
            const numSegments = prizes.length;
            const arcSize = (2 * Math.PI) / numSegments;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSegments; i++) {
                const angle = currentAngle + (i * arcSize);
                
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(160, 160);
                ctx.arc(160, 160, 160, angle, angle + arcSize);
                ctx.lineTo(160, 160);
                ctx.fill();
                ctx.strokeStyle = "#ffffff"; 
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(160, 160);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#333";
                ctx.font = "bold 16px Arial";
                ctx.fillText(prizes[i], 145, 6);
                ctx.restore();
            }
        }

        // 本物らしい物理イージング関数（Quintic Ease Out）
        // 最初のブレーキは強く、止まる直前は非常にゆっくり粘る
        function easeOutQuint(t) {
            return 1 - Math.pow(1 - t, 5);
        }

        // メインアニメーション
        function updateAnimation(timestamp) {
            if (!isSpinning) return;

            if (isStopping) {
                if (!stopStartTime) {
                    stopStartTime = timestamp;
                    startAngle = currentAngle;

                    // 現在の角度から、指定のマス（targetIndex）が真上に来る最終角度を逆算
                    const arcSize = (2 * Math.PI) / prizes.length;
                    // 本物のルーレットらしく、STOPを押してから最低4回転(8*PI)以上させてから着地させる
                    const baseFinalAngle = -Math.PI / 2 - (targetIndex * arcSize) - (arcSize / 2);
                    
                    // 現在の角度より過去に戻らないよう、十分な回転数を加算して目標角度を固定
                    const currentLaps = Math.ceil(currentAngle / (2 * Math.PI));
                    targetFinalAngle = baseFinalAngle - ((currentLaps + 5) * 2 * Math.PI);
                }

                let elapsed = timestamp - stopStartTime;
                let progress = Math.min(elapsed / duration, 1);

                // 物理的な粘り気のある減速を適用
                let ease = easeOutQuint(progress);
                currentAngle = startAngle + (targetFinalAngle - startAngle) * ease;

                if (progress >= 1) {
                    // 完全に停止
                    isSpinning = false;
                    isStopping = false;
                    stopButton.disabled = true;
                    
                    // 誤差をなくすため正確な最終角度に固定
                    const arcSize = (2 * Math.PI) / prizes.length;
                    currentAngle = -Math.PI / 2 - (targetIndex * arcSize) - (arcSize / 2);
                    drawWheel();

                    resultDiv.innerText = `結果は 【${prizes[targetIndex]}】 です！`;
                    return;
                }
            } else {
                // 通常時の高速回転（滑らかに一定速度で回す）
                currentAngle -= 0.25; 
            }

            drawWheel();
            requestAnimationFrame(updateAnimation);
        }

        // 自動スタート
        window.addEventListener("DOMContentLoaded", () => {
            drawWheel();
            setTimeout(() => {
                isSpinning = true;
                stopButton.disabled = false;
                resultDiv.innerText = "ルーレット回転中...";
                requestAnimationFrame(updateAnimation);
            }, 600);
        });

        // STOPボタン
        stopButton.addEventListener("click", () => {
            if (isSpinning && !isStopping) {
                isStopping = true;
                stopButton.disabled = true;
                resultDiv.innerText = "シューーーー…（減速中）";
            }
        });
    </script>
</body>
</html>
