<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコード連動ルーレット</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #2c3e50;
        }
        .subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 30px auto;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff4757;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.3);
            width: 80%;
        }
        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        .btn:disabled {
            background-color: #bdc3c7;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        .btn.stop-mode {
            background-color: #e74c3c;
            box-shadow: 0 4px 6px rgba(231, 76, 60, 0.3);
        }
        .btn.stop-mode:hover {
            background-color: #c0392b;
        }
        #result {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
            height: 30px;
            color: #2c3e50;
        }
        .info-box {
            margin-top: 20px;
            background-color: #ecf0f1;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
            text-align: left;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>QRコード連動ルーレット</h1>
    <div class="subtitle" id="url-display">QRコードからパラメータを読み込みます</div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
    </div>

    <button id="actionBtn" class="btn" disabled>STOP</button>

    <div id="result"></div>

    <div class="info-box">
        <strong>💡 使い方・仕組み:</strong><br>
        1. URLの末尾に <code>?id=123</code> や <code>?id=apple</code> のように文字を自由につけてQRコードを作成します。<br>
        2. カメラで読み取ると自動で高速回転が始まります。<br>
        3. 「STOP」を押すと、十分な時間をかけて滑らかに減速します。<br>
        4. 結果はIDから計算された固定値（ハッシュ）になるため、同じQRコードなら必ず同じ結果になります。
    </div>
</div>

<script>
    // ルーレットの選択肢（名前と色）
    const segments = [
        { label: "大吉", color: "#fad390" },
        { label: "中吉", color: "#f8a5c2" },
        { label: "小吉", color: "#18dcff" },
        { label: "吉", color: "#32ff7e" },
        { label: "末吉", color: "#7efff5" },
        { label: "凶", color: "#cd84f1" }
    ];

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const actionBtn = document.getElementById("actionBtn");
    const resultDiv = document.getElementById("result");
    const urlDisplay = document.getElementById("url-display");

    const size = canvas.width;
    const center = size / 2;
    const radPerSeg = (2 * Math.PI) / segments.length;

    let currentAngle = 0;
    let speed = 0;
    let isSpinning = false;
    let isStopping = false;
    let targetAngle = null;
    let stopProgress = 0;
    const duration = 240; // 減速にかけるフレーム数（約4秒）
    let initialStopSpeed = 0;

    // キャンバスにルーレットを描画する関数
    function drawWheel(angle) {
        ctx.clearRect(0, 0, size, size);
        segments.forEach((seg, i) => {
            const startAngle = i * radPerSeg + angle - Math.PI / 2;
            const endAngle = startAngle + radPerSeg;
            
            // 扇形を描画
            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.arc(center, center, center - 5, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = seg.color;
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();

            // テキストを描画
            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(startAngle + radPerSeg / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#2c3e50";
            ctx.font = "bold 16px Arial";
            ctx.fillText(seg.label, center - 20, 6);
            ctx.restore();
        });

        // 中央の円形飾り
        ctx.beginPath();
        ctx.arc(center, center, 20, 0, 2 * Math.PI);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.strokeStyle = "#cbd5e1";
        ctx.stroke();
    }

    // 文字列を数値（ハッシュ値）に変換する関数 (同じ文字なら必ず同じ数を返す)
    function hashCode(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        return Math.abs(hash);
    }

    // 初期化と自動スタート処理
    // URLのパラメータから id を取得 (?id=xxxxx)
    const urlParams = new URLSearchParams(window.location.search);
    const qrId = urlParams.get('id');

    if (qrId) {
        urlDisplay.innerText = `読み込み成功 (ID: ${qrId})`;
        // 自動で高速回転をスタート
        isSpinning = true;
        speed = 0.4; // 高速回転の速度
        actionBtn.disabled = false;
        actionBtn.classList.add("stop-mode");
        actionBtn.innerText = "STOP";
    } else {
        urlDisplay.innerHTML = `<span style="color: #e74c3c; font-weight:bold;">⚠️ URLに ?id=xxx をつけてアクセスしてください</span>`;
        drawWheel(0);
    }

    // ルーレットのメインループ
    function update() {
        if (!isSpinning) return;

        if (!isStopping) {
            // 普通に一定速度で回転中
            currentAngle += speed;
        } else {
            // STOPボタンが押された後の滑らかな減速（イージング処理）
            stopProgress++;
            const t = stopProgress / duration;
            
            // イージング関数 (Cubic Out): 最初は速く、後半にかけて滑らかに超減速
            const easeOutCubic = 1 - Math.pow(1 - t, 3);
            
            // 現在の角度を決定的な目標角度に向けて補間
            currentAngle = startAngleAtStop + (targetAngle - startAngleAtStop) * easeOutCubic;

            if (stopProgress >= duration) {
                // 完全に停止
                isSpinning = false;
                isStopping = false;
                currentAngle = targetAngle; // 完全に目標値に合わせる
                showResult();
            }
        }

        // 360度の範囲に収める
        currentAngle = currentAngle % (2 * Math.PI);
        drawWheel(currentAngle);
        requestAnimationFrame(update);
    }

    let startAngleAtStop = 0;

    // STOPボタンが押された時の処理
    actionBtn.addEventListener("click", () => {
        if (!isSpinning || isStopping) return;

        actionBtn.disabled = true; // 連続押し防止
        actionBtn.innerText = "減速中...";
        actionBtn.classList.remove("stop-mode");

        // QRのIDを元に、どのセグメントで止めるかを「完全に固定」する
        const hash = hashCode(qrId);
        const targetSegmentIndex = hash % segments.length;

        // 的（12時方向 = -Math.PI/2）に選ばれたセグメントの中心が来るように調整
        // セグメントiの中心角度 = i * radPerSeg + radPerSeg / 2
        // 針を指すための補正を含めた停止時のベース角度を計算
        const targetBaseAngle = (2 * Math.PI) - (targetSegmentIndex * radPerSeg + radPerSeg / 2);
        
        startAngleAtStop = currentAngle;

        // 「十分な時間をかけて徐々に減速」させるため、最低でも数回転(例: 5回転 = 10*Math.PI)させてから止める
        const extraRotations = 4 * 2 * Math.PI; 
        
        // 最終的な着地角度を決定
        targetAngle = startAngleAtStop + extraRotations + ((targetBaseAngle - (startAngleAtStop % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI));
        
        isStopping = true;
        stopProgress = 0;
    });

    // 結果表示
    function showResult() {
        // 現在の角度から真上(12時方向)にあるセグメントを逆算
        const normalizedAngle = (2 * Math.PI - currentAngle) % (2 * Math.PI);
        const index = Math.floor(normalizedAngle / radPerSeg) % segments.length;
        const result = segments[index];
        
        resultDiv.innerText = `結果: 🎉 【${result.label}】`;
        actionBtn.innerText = "終了";
    </div>

    // 自動実行ループの開始
    if (isSpinning) {
        requestAnimationFrame(update);
    }
</script>

</body>
</html>
