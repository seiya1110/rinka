<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコード連動ルーレット</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #e94560;
            margin-bottom: 10px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background-color: #16213e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        /* 一番最初のルーレットコンテナの再現 */
        .roulette-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 30px auto;
        }
        /* 一番最初の極上なめらかイージングの再現 */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            /* 当たり🎯(5つ)とはずれ❌(5つ)を交互に10分割（36度ずつ）表現したグラデーション */
            background: conic-gradient(
                #e94560 0deg 36deg,    #3a6cb4 36deg 72deg,
                #e94560 72deg 108deg,  #3a6cb4 108deg 144deg,
                #e94560 144deg 180deg, #3a6cb4 180deg 216deg,
                #e94560 216deg 252deg, #3a6cb4 252deg 288deg,
                #e94560 288deg 324deg, #3a6cb4 324deg 360deg
            );
            position: relative;
        }
        /* 高速回転中のアニメーションクラス（クラスON/OFFで制御） */
        .wheel.spinning {
            animation: fast-spin 0.2s linear infinite;
        }
        /* STOPを押した後の減速設定（一番最初のコードの数値を完全再現） */
        .wheel.stopping {
            transition: transform 3s cubic-bezier(0.1, 0.8, 0.1, 1);
        }
        /* マス目の中の絵文字テキスト */
        .wheel-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        .segment-label {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            transform-origin: 50% 50%;
            font-size: 18px;
            padding-top: 15px;
            box-sizing: border-box;
            font-weight: bold;
        }
        /* 一番最初の矢印（針）の再現 */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #fff;
            z-index: 10;
        }
        /* ボタンのスタイル */
        .btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 45px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn:disabled {
            background-color: #555;
            box-shadow: none;
            cursor: not-allowed;
        }
        .result {
            font-size: 24px;
            font-weight: bold;
            margin-top: 25px;
            min-height: 33px;
            color: #00f5ff;
        }
        .info {
            font-size: 13px;
            color: #888;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        @keyframes fast-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }
    </style>
</head>
<body>

    <h1>QRコード連動ルーレット</h1>
    <div id="debug-id" class="info"></div>
    
    <div class="container">
        <div class="roulette-container">
            <div class="pointer"></div>
            <div id="wheel" class="wheel">
                <!-- 10マスのテキストをJavaScriptで自動生成して配置します -->
                <div id="wheel-text" class="wheel-text"></div>
            </div>
        </div>
        <button id="stop-btn" class="btn" onclick="stopRoulette()" disabled>STOP</button>
        <div id="roulette-result" class="result">読み込み中...</div>
    </div>

    <script>
        // 当たり5つ、はずれ5つの交互10マス構成
        const prizes = ["当たり🎯", "はずれ❌", "当たり🎯", "はずれ❌", "当たり🎯", "はずれ❌", "当たり🎯", "はずれ❌", "当たり🎯", "はずれ❌"];
        
        const wheel = document.getElementById('wheel');
        const stopBtn = document.getElementById('stop-btn');
        const resultDiv = document.getElementById('roulette-result');

        // URLから「?id=xxx」を取得する処理
        function getQrId() {
            let urlParams = new URLSearchParams(window.location.search);
            let id = urlParams.get('id');
            if (!id) {
                const match = window.location.href.match(/[?&]id=([^&#]*)/);
                id = match ? match : null;
            }
            return id;
        }

        const qrId = getQrId() || "default";
        document.getElementById("debug-id").innerText = `読み込んだID: ${qrId}`;

        // 文字列から固定の数値を生成する（ハッシュ関数）
        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return hash;
        }

        // IDに基づいて「どのマスで止まるか」を事前に完全固定
        const hash = hashCode(qrId);
        const targetIndex = Math.abs(hash) % prizes.length;

        // ルーレットの盤面に絵文字を配置する初期化処理
        function initWheelLabels() {
            const container = document.getElementById('wheel-text');
            const numSegments = prizes.length;
            const angleStep = 360 / numSegments;

            for (let i = 0; i < numSegments; i++) {
                const label = document.createElement('div');
                label.className = 'segment-label';
                // 各マス目の中心に文字が来るように回転させて配置
                label.style.transform = `rotate(${i * angleStep + (angleStep / 2)}deg)`;
                label.innerText = prizes[i];
                container.appendChild(label);
            }
        }

        // 自動スタート処理
        window.addEventListener("DOMContentLoaded", () => {
            initWheelLabels();
            
            // 読み込み完了後、自動で最高速回転スタート
            setTimeout(() => {
                wheel.classList.add('spinning');
                stopBtn.disabled = false;
                resultDiv.innerText = "ルーレット回転中...";
            }, 500);
        });

        // STOPボタンが押された時の処理
        function stopRoulette() {
            stopBtn.disabled = true;
            resultDiv.innerText = "減速中...";

            // 高速ループアニメーション用のクラスを解除
            wheel.classList.remove('spinning');
            
            // 一番最初の滑らかなイージング用CSSクラスを付与
            wheel.classList.add('stopping');

            // 1マスの角度（10マスのため36度）
            const angleStep = 360 / prizes.length;
            
            // 指定のマス（targetIndex）を正確に真上の針の位置に止めるための角度
            // 初期状態の0度が「1マス目の左境界線」になるため、針の位置（真上）に合わせる計算
            const targetAngle = 360 - (targetIndex * angleStep) - (angleStep / 2);
            
            // 一番最初のコードと同じく、しっかりと何回転（ここでは5回転=1800度）かさせてから指定位置にピタッと着地させる
            const finalRotation = 1800 + targetAngle;

            // 回転を適用
            wheel.style.transform = `rotate(${finalRotation}deg)`;

            // 3秒間の transition が終わったタイミングで結果を表示
            setTimeout(() => {
                resultDiv.innerText = `結果は 【${prizes[targetIndex]}】 です！`;
            }, 3000); // transitionの3秒（3000ms）と同期
        }
    </script>
</body>
</html>
