<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコード連動ルーレット</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .roulette-container {
            position: relative;
            margin: 20px auto;
            width: 320px;
            height: 320px;
        }
        canvas {
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        /* 上部の矢印（針） */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff3b30;
            z-index: 10;
        }
        #stopButton {
            background-color: #ff3b30;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 20px;
        }
        #stopButton:active {
            transform: scale(0.95);
        }
        #stopButton:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #result {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-top: 20px;
            height: 40px;
        }
        .info {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>QRコード連動ルーレット</h1>
    <div id="debug-id" class="info"></div>

    <div class="roulette-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="320" height="320"></canvas>
    </div>

    <button id="stopButton" disabled>STOP</button>
    <div id="result"></div>

    <script>
        // 景品の設定（6マス）
        const prizes = ["大吉", "中吉", "小吉", "吉", "末吉", "凶"];
        const colors = ["#ff4d4d", "#ffaf40", "#fffa65", "#32ff7e", "#7efff5", "#18dcff"];

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const stopButton = document.getElementById("stopButton");
        const resultDiv = document.getElementById("result");

        let currentAngle = 0; // 現在の回転角度（ラジアン）
        let speed = 0;        // 回転速度
        let isSpinning = false;
        let isStopping = false;
        let targetIndex = 0;  // 停止させる狙いのマスのインデックス
        let stopTimer = 0;
        let totalStopDuration = 4000; // STOPを押してから止まるまでの時間（4秒）

        // 1. URLから「?id=xxx」を取得する処理（環境依存対策版）
        function getQrId() {
            // 通常の取得方法
            let urlParams = new URLSearchParams(window.location.search);
            let id = urlParams.get('id');
            
            // もしスラッシュの位置などでうまく取れない場合のフォールバック対策
            if (!id) {
                const match = window.location.href.match(/[?&]id=([^&#]*)/);
                id = match ? match[1] : null;
            }
            return id;
        }

        const qrId = getQrId() || "default";
        document.getElementById("debug-id").innerText = `読み込んだID: ${qrId}`;

        // 2. 文字列から固定の数値を生成する（ハッシュ関数）
        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return hash;
        }

        // IDに基づいて、このQRコードが「どのマスで止まるか」を事前に完全固定
        const hash = hashCode(qrId);
        targetIndex = Math.abs(hash) % prizes.length;

        // ルーレットの盤面を描画
        function drawWheel() {
            const numSegments = prizes.length;
            const arcSize = (2 * Math.PI) / numSegments;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSegments; i++) {
                const angle = currentAngle + (i * arcSize);
                
                // セグメント（扇形）の描画
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(160, 160);
                ctx.arc(160, 160, 160, angle, angle + arcSize);
                ctx.lineTo(160, 160);
                ctx.fill();
                ctx.stroke();

                // テキストの描画
                ctx.save();
                ctx.translate(160, 160);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#333";
                ctx.font = "bold 18px Arial";
                ctx.fillText(prizes[i], 140, 10);
                ctx.restore();
            }
        }

        // メインのアニメーションループ
        function updateAnimation(timestamp) {
            if (!isSpinning) return;

            if (isStopping) {
                if (!stopTimer) stopTimer = timestamp;
                let elapsed = timestamp - stopTimer;

                if (elapsed >= totalStopDuration) {
                    // 時間になったら完全に停止
                    isSpinning = false;
                    isStopping = false;
                    speed = 0;
                    stopButton.disabled = true;

                    // 針（真上=-PI/2）が指しているマスを正確に割り出して、微調整
                    // 計算上、必ずtargetIndexのマスが真上にくるように角度を固定します
                    const arcSize = (2 * Math.PI) / prizes.length;
                    currentAngle = -Math.PI / 2 - (targetIndex * arcSize) - (arcSize / 2);
                    drawWheel();

                    resultDiv.innerText = `結果は 【${prizes[targetIndex]}】 です！`;
                    return;
                }

                // じわじわと滑らかに減速させるイージング（ブレーキ計算）
                let progress = elapsed / totalStopDuration;
                // イージング関数（後半にかけて急激に減速）
                let easeOut = 1 - Math.pow(1 - progress, 3);
                
                // 停止位置（targetIndex）にピタッと止まるための目標角度を逆算して補間
                const arcSize = (2 * Math.PI) / prizes.length;
                const finalAngle = -Math.PI / 2 - (targetIndex * arcSize) - (arcSize / 2);
                
                // 開始時の角度から、目標の角度（複数回転分を上乗せ）に向かって滑らかに補間
                if (!window.startStoppingAngle) {
                    window.startStoppingAngle = currentAngle;
                    // 最低でも3回転(6*PI)させてから指定位置に止める
                    window.targetFinalAngle = finalAngle - (4 * 2 * Math.PI); 
                }
                
                currentAngle = window.startStoppingAngle + (window.targetFinalAngle - window.startStoppingAngle) * easeOut;

            } else {
                // 通常の高速回転中
                currentAngle += speed;
            }

            drawWheel();
            requestAnimationFrame(updateAnimation);
        }

        // 自動スタート処理
        window.addEventListener("DOMContentLoaded", () => {
            drawWheel();
            
            // ページが開かれたら自動で高速回転をスタート
            setTimeout(() => {
                isSpinning = true;
                speed = 0.5; // 高速回転の速度
                stopButton.disabled = false;
                resultDiv.innerText = "ルーレット回転中...";
                requestAnimationFrame(updateAnimation);
            }, 500); // 読込後0.5秒で開始
        });

        // STOPボタンが押された時の処理
        stopButton.addEventListener("click", () => {
            if (isSpinning && !isStopping) {
                isStopping = true;
                stopButton.disabled = true;
                resultDiv.innerText = "じわじわ減速中...";
            }
        });
    </script>
</body>
</html>
